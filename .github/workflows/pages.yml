name: Deploy bilingual course to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild deterministic standalone pages
        run: |
          python3 scripts/build_data.py
          python3 scripts/build_course.py --output index.html
          python3 scripts/build_data_en.py
          python3 scripts/build_course_en.py
          git diff --exit-code

      - name: Validate public files
        run: |
          test -f index.html
          test -f en/index.html
          test -f README.md
          test -f README_EN.md
          test -f LICENSE
          python3 scripts/validate_public_site.py
          python3 scripts/public_release_scan.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
